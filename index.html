<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive rating component</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="rating-container">
    <article class="rating-card">
      <div class="star-container">
      <img src="icon-star.svg" class="star-icon" alt="">
      </div>
      <h1>How did we do?</h1>
      <p>Please let us know how we did with your support request. All feedback is appreciated 
  to help us improve our offering!</p>
  <div class="rating-options">
    <button type="button" class="rating-btn">1</button>
    <button type="button" class="rating-btn">2</button>
    <button type="button" class="rating-btn">3</button>
    <button type="button" class="rating-btn">4</button>
    <button type="button" class="rating-btn">5</button>
  </div>
  <button type="submit" class="submit-btn">SUBMIT</button>
    </article>
    <article class="thank-you-card">
      <img src="illustration-thank-you.svg" alt="">
      <p class="selected-rating">
        You selected <span class="rating-value">0</span>
        out of 5
      </p>
      <h2>Thank you</h2>
      <p class="thank-you-message">
        We appreciate you taking the time to give a rating. If you ever need more support, 
  don’t hesitate to get in touch!
      </p>
    </article>
  </main>
  <script src="script.js"></script>
</body>

</html>
